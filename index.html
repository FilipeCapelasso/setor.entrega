/* ===== AUTOAJUSTE: o site se encaixa na tela (sem rolar a página), em qualquer monitor ===== */
html,body{height:100%;margin:0}body{overflow:hidden}

<body>
<div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{
/* ===== CONFIGURAÇÃO: preencha aqui OU use a tela #/config (salva neste navegador). Use somente a chave ANON. ===== */
const CFG={url:"https://qrmwgqkiwoenlkfzjazs.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFybXdncWtpd29lbmxrZnpqYXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MDc3OTIsImV4cCI6MjEwNjM4Mzc5Mn0.lhgkQS_WcB55uG0SKk0ngQgpc9oruFRt2H2D8orjNnc"};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=n=>n+(n===1?' moto':' motos');
const ft=i=>i?new Date(i).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const MSG={gen:'Não foi possível salvar os dados. Verifique a conexão e tente novamente.',over:'Digite somente os 6 últimos dígitos do chassi.'};
const saved=(()=>{try{return JSON.parse(localStorage.getItem('motos_cfg')||'{}')}catch(e){return{}}})();
const URL_=CFG.url||saved.url,KEY=CFG.key||saved.key;
const route=location.hash.replace(/^#\/?/,'');
let Z=1;try{Z=parseFloat(localStorage.getItem('motos_zoom'))||1}catch(e){}
const setZ=z=>{Z=Math.min(1.6,Math.max(.6,Math.round(z*100)/100));document.documentElement.style.setProperty('--z',Z);try{localStorage.setItem('motos_zoom',Z)}catch(e){}const e=$('#zv');if(e)e.textContent=Z===1?'Auto':Math.round(Z*100)+'%'};
setZ(Z);
addEventListener('hashchange',()=>location.reload());

/* ---------- validação ---------- */
const vChassi=v=>!v?'Informe os 6 últimos dígitos do chassi.':/\D/.test(v)?'O chassi deve conter somente números (sem espaços).':v.length>6?MSG.over:v.length<6?'O chassi precisa ter exatamente 6 dígitos.':null;
function fail(e){const t=((e&&e.message)||'')+' '+((e&&e.details)||''),c=e&&e.code;
 if(t.includes('BATERIA_DUPLICADA')||(c==='23505'&&t.includes('codigo_bateria')))return 'Código de bateria já utilizado. Esse código já está associado a outra moto.';
 if(c==='23505'&&t.includes('chassi'))return 'Chassi já cadastrado.';
 if(t.includes('MOTO_INEXISTENTE'))return 'Esta moto não existe mais. Ela pode ter sido removida pela entrega.';
 if(t.includes('HORARIO_CHEIO'))return 'Esse horário já tem 2 motos (outro computador pode ter ocupado a vaga). Escolha outro horário.';
 if(c==='PGRST204'||(t.includes('horario')&&t.includes('column')))return 'Falta criar a coluna "horario" no Supabase. Rode o arquivo supabase-completo.sql.';
 return MSG.gen}

/* ---------- UI comum ---------- */
function toast(t,x,k){const d=document.createElement('div');d.className='toast '+(k||'');d.innerHTML='<b>'+esc(t)+'</b>'+(x?'<small>'+esc(x)+'</small>':'');$('#toasts').append(d);setTimeout(()=>d.remove(),4500)}
function openModal(h){const m=$('#modal');m.innerHTML='<div class="box" role="dialog" aria-modal="true">'+h+'</div>';m.hidden=false;const a=m.querySelector('input,button');a&&a.focus()}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const actions={};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&actions[b.dataset.a])actions[b.dataset.a](b.dataset.id,b)});
const fmtBat=c=>/^\d{6}$/.test(c)?c.slice(0,2)+'/'+c.slice(2,4)+'/'+c.slice(4):c;
const bat=(c,l)=>c?'<span class="bat'+(l?' lg':'')+'"><i aria-hidden="true">🔋</i><span class="mono">'+esc(fmtBat(c))+'</span></span>':'<span class="mut">Aguardando</span>';

/* ---------- dados + realtime ---------- */
let sb,ch,motos=[],loaded=false,loadErr=false,conn='connecting';const removed=new Set(),hooks={render(){},onActivated:null};
const ts=m=>Date.parse(m.updated_at);
function setConn(s){conn=s;const e=$('#conn');if(e)e.textContent={connected:'🟢 Conectado',reconnecting:'🟠 Reconectando...',connecting:'🟠 Conectando...'}[s]}
function dbInfo(){
  const shortUrl=URL_||'—';
  return '<span class="dbpill" title="Projeto Supabase conectado">☁️ Supabase · '+esc(shortUrl.replace('https://',''))+'</span>';
}

function upsert(m,remote){if(removed.has(m.id))return;const i=motos.findIndex(x=>x.id===m.id),o=motos[i];if(o&&ts(o)>ts(m))return;
 if(remote&&o&&o.status!=='ativada'&&m.status==='ativada'&&hooks.onActivated)hooks.onActivated(m);
 if(i>=0)motos[i]=m;else{motos.push(m);motos.sort((a,b)=>a.seq-b.seq)}hooks.render()}
function drop(id){removed.add(id);motos=motos.filter(x=>x.id!==id);hooks.render()}
async function load(){const r=await sb.from('motos').select('*').order('seq');
 if(r.error){loadErr=true;if(!loaded)hooks.render();return}
 const loc=new Map(motos.map(m=>[m.id,m]));
 motos=r.data.filter(m=>!removed.has(m.id)).map(m=>{const l=loc.get(m.id);return l&&ts(l)>ts(m)?l:m});
 loaded=true;loadErr=false;hooks.render()}
function connect(){
 ch=sb.channel('motos-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'motos'},p=>{
  if(p.eventType==='DELETE'){if(p.old&&p.old.id)drop(p.old.id)}else upsert(p.new,true)})
 .subscribe(s=>{if(s==='SUBSCRIBED'){setConn('connected');load()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED')setConn('reconnecting')});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
 addEventListener('online',load);addEventListener('offline',()=>setConn('reconnecting'));
 addEventListener('pagehide',()=>sb.removeChannel(ch));load()}
async function add(v){const r=await sb.from('motos').insert(v).select().single();if(r.error)throw r.error;return r.data}
async function edit(id,v){const r=await sb.from('motos').update(v).eq('id',id).select().maybeSingle();if(r.error)throw r.error;if(!r.data)throw{message:'MOTO_INEXISTENTE'};return r.data}
async function del(id){const r=await sb.from('motos').delete().eq('id',id).select('id');if(r.error)throw r.error}
async function activate(id,code){const r=await sb.rpc('ativar_moto',{p_id:id,p_codigo:code});if(r.error)throw r.error;return Array.isArray(r.data)?r.data[0]:r.data}
function reconcile(parent,items,make,upd){const cur=new Map([...parent.children].map(e=>[e.dataset.id,e]));let prev=null;
 items.forEach(m=>{let e=cur.get(m.id);if(e){cur.delete(m.id);upd(e,m)}else e=make(m);const w=prev?prev.nextSibling:parent.firstChild;if(e!==w)parent.insertBefore(e,w);prev=e});
 cur.forEach(e=>e.remove())}
const loadHtml=()=>loadErr?'⚠️ Não foi possível carregar as motos do Supabase. <button class="btn" data-a="retry">Tentar novamente</button>':'Carregando motos...';
actions.retry=load;actions.close=closeModal;

function delivery(){let filter='todas',q='',raf=0,keepOn=false,last='',okT=0;const MAXR=400;let hf='',lastH='',C=new Map();const inflight=new Map(),SL=[];
